name: Generar Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Generar AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar estructura nativa
        run: npm run build:native

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Comprobar sintaxis
        run: npm run check

      - name: Ejecutar pruebas
        run: npm test

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Comprobar secretos de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Falta configurar el secreto ${secret_name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Restaurar clave de carga
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/evia-upload.jks"
          chmod 600 "${RUNNER_TEMP}/evia-upload.jks"

      - name: Compilar AAB Release firmado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/evia-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verificar AAB y firma
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "${AAB_PATH}"
          jarsigner -verify -certs "${AAB_PATH}"

      - name: Publicar AAB Release
        uses: actions/upload-artifact@v7
        with:
          name: evia-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Eliminar clave temporal
        if: always()
        run: rm -f "${RUNNER_TEMP}/evia-upload.jks"
